<!DOCTYPE html>
<html>
  <head>
  <meta charset="UTF-8" />

    <style>

      body {
        margin: 0;
        background: transparent;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        height: 100vh;
        font-family: 'Segoe UI', sans-serif;
      }

      .db-icon {
        width: 85px;
        height: 85px;
        margin-bottom: 6px;
      }

      h1 {
        margin: 0;
        font-size: 24px;
        letter-spacing: 2px;
        color: #025F51;
        text-align: center;
        animation: pulse 1.5s ease-in-out infinite;
      }

      .float {
        animation: float 2s ease-in-out infinite;
      }

      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
        100% { transform: translateY(0px); }
      }

      .pulse {
        animation: pulse 1.5s ease-in-out infinite;
      }

      @keyframes pulse {
        0% { opacity: 0.6; }
        50% { opacity: 1; }
        100% { opacity: 0.6; }
      }

    </style>

  </head>
  <body>

    <svg class="db-icon float pulse" viewBox="0 0 24 24" fill="none" stroke="url(#grad1)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <defs>

        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#025F51"/>
          <stop offset="100%" stop-color="#04A777"/>
        </linearGradient>

      </defs>

      <ellipse cx="12" cy="5" rx="9" ry="3"/>
      <path d="M3 5v6c0 1.7 4 3 9 3s9-1.3 9-3V5"/>
      <path d="M3 11v6c0 1.7 4 3 9 3s9-1.3 9-3v-6"/>
    </svg>

    <h1>Anlinet</h1>

  </body>
</html>
